# Expose the package-owned Noctalia plugin in the default per-user XDG data dir.
# Type L deliberately preserves an existing user-managed path.
d %h/.local/share/noctalia 0755 - - -
d %h/.local/share/noctalia/plugins 0755 - - -
L %h/.local/share/noctalia/plugins/prox2-superstrike - - - - /usr/share/prox2-superstrike/noctalia/prox2-superstrike
